name: Build and Deploy
on:
  push:
    branches:
      - gh-pages  # Trigger the workflow on push to the main branch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup Node
      uses: actions/setup-node@v2
      with:
        node-version: '20.x' # Use LTS version
    - run: npm install --force
    - run: npm run build

    - name: Copy CNAME
      run: |
        if [ -f CNAME ]; then
          cp CNAME dist/
        fi

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: web  # Deploy to gh-pages branch
