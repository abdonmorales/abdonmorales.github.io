name: Astro Portfolio CI

# Ejecuta en cualquier push o pull request
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '21.2.0'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install --force
      
    - name: Lint TypeScript & Frontend Code
      run: npm run lint || echo "Lint errors found, but continuing workflow"
      
    - name: Run Stylelint (con reporte pero sin fallar)
      run: npx stylelint "src/**/*.css" || echo "Stylelint issues found, but continuing workflow"
      
    - name: Build Astro Site
      run: npm run build
      
    - name: Check for type errors (con reporte pero sin fallar)
      run: npx tsc --noEmit || echo "TypeScript errors found, but continuing workflow"
      
    - name: Perform security audit
      run: npm audit --production --audit-level=high || true